spring:
  application:
    name: aws-developer-labs
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

aws:
  s3:
    bucket-name: ${AWS_BUCKET_NAME:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
